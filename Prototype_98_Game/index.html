<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Pasar Sunyi - Side Scroller 2D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="hud">
      <span><b>A / D</b> atau <b>← / →</b> jalan</span>
      <span><b>Shift</b> lari</span>
      <span><b>Spasi / W / ↑</b> lompat</span>
      <span><b>F1</b> debug</span>
    </div>

    <!-- Kontrol sentuh (muncul otomatis di layar sentuh) -->
    <div id="touch">
      <div class="grp">
        <button id="btnLeft">◀</button>
        <button id="btnRight">▶</button>
      </div>
      <button id="btnJump">▲</button>
    </div>

    <div id="loading">Memuat aset…</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
